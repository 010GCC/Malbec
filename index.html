// ── Enemy Spawning ─────────────────────────────
function spawnEnemy(worldX) {
  const pal = GS.world.palette;
  let type;
  if (GS.level === 1) {
    type = Math.random() < 0.5 ? 'head' : 'legs';
  } else {
    type = ['head','legs','torso'][randInt(0,2)];
  }

  const fw = FLOOR_Y();
  const flying = type === 'head';
  const seed = randInt(1, 99999);

  const enemy = {
    type,
    x: worldX,
    y: flying ? rand(fw*0.2, fw*0.55) : fw - 30,
    w: type==='torso' ? 52 : 28,
    h: type==='torso' ? 40 : (flying ? 22 : 28),
    vx: type==='torso' ? rand(-60,-30) : (flying ? rand(-100,-60) : rand(-80,-40)),
    vy: flying ? Math.sin(Date.now()*0.002)*20 : 0,
    hp: type==='torso' ? 4 : 2,
    hitFlash: 0,
    alive: true,
    sprite: genSprite(seed, type==='torso'?52:28, type==='torso'?40:(flying?22:28), pal),
    seed,
    // Blob (legs) animation state
    blobPhase: 'move',
    blobTimer: rand(0.4, 0.9),
    // Alien (torso) animation state
    alienPhase: 'stalk',
    alienTimer: rand(0.8, 2.0),
  };
  GS.enemies.push(enemy);
}

function updateEnemies(dt) {
  GS.enemySpawnTimer -= dt;
  if (GS.enemySpawnTimer <= 0 && GS.distanceTraveled < GS.distanceGoal - canvas.width*0.3) {
    GS.enemySpawnTimer = rand(1.5, 3.5);
    const wx = GS.cameraX + canvas.width * 1.1;
    spawnEnemy(wx);
    if (Math.random() < 0.4) spawnEnemy(wx + rand(100,300));
  }

  const fw = FLOOR_Y();
  const p = GS.player;

  for (const e of GS.enemies) {
    if (!e.alive) continue;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    const screenX = e.x - GS.cameraX;
    // Off-screen left: remove
    if (screenX < -200) { e.alive = false; continue; }

    // Move toward player
    const dx = (p.x) - e.x;
    const dir = dx < 0 ? -1 : 1;
    if (e.type === 'head') {
      e.x += e.vx * dt;
      e.vy = Math.sin(GS.levelTimer * 2 + e.seed) * 80;
      e.y += e.vy * dt;
      e.y = clamp(e.y, fw*0.15, fw*0.6);
      if (e.x - GS.cameraX < -50) e.vx = Math.abs(e.vx);
      if (e.x - GS.cameraX > canvas.width*0.9) e.vx = -Math.abs(e.vx);
    } else if (e.type === 'legs') {
      // Blob: burst toward player, short pause, repeat
      e.blobTimer -= dt;
      if (e.blobTimer <= 0) {
        if (e.blobPhase === 'move') {
          e.blobPhase = 'pause';
          e.blobTimer = rand(0.28, 0.52);
          e.vx = 0;
        } else {
          e.blobPhase = 'move';
          e.blobTimer = rand(0.5, 1.0);
          e.vx = dir * rand(100, 145);
        }
      }
      if (e.blobPhase === 'move') e.x += e.vx * dt;
      e.y = fw - e.h;
    } else {
      // Alien: slow stalk then sudden lunge
      e.alienTimer -= dt;
      if (e.alienTimer <= 0) {
        if (e.alienPhase === 'stalk') {
          e.alienPhase = 'lunge';
          e.alienTimer = rand(0.3, 0.55);
          e.vx = dir * rand(190, 260);
        } else {
          e.alienPhase = 'stalk';
          e.alienTimer = rand(1.2, 2.2);
        }
      }
      if (e.alienPhase === 'stalk') e.vx = lerp(e.vx, dir * 48, 0.05);
      else e.vx *= 0.94;
      e.x += e.vx * dt;
      e.y = fw - e.h;
    }

    // Player contact damage
    const ex = e.x - GS.cameraX;
    if (rectsOverlap({x:ex, y:e.y, w:e.w, h:e.h}, {x:p.x - GS.cameraX + 2, y:p.y, w:p.w-4, h:p.h}) && !p.isEvading) {
      takeDamage(ENEMY_CONTACT_DMG);
    }

    // Check player attack
    if (p.attackHitbox) {
      const ah = {
        x: p.attackHitbox.x - GS.cameraX + GS.cameraX,
        y: p.attackHitbox.y,
        w: p.attackHitbox.w, h: p.attackHitbox.h
      };
      const ahScreen = { x: p.attackHitbox.x, y: p.attackHitbox.y, w: p.attackHitbox.w, h: p.attackHitbox.h };
      if (rectsOverlap({x:ex, y:e.y, w:e.w, h:e.h}, {x: p.attackHitbox.x - GS.cameraX, y:p.attackHitbox.y, w:p.attackHitbox.w, h:p.attackHitbox.h})) {
        e.hp--;
        e.hitFlash = 0.15;
        p.attackHitbox = null;
        p.attackTimer = 0;
        GS.score += 50;
        spawnParticles(ex+e.w/2, e.y+e.h/2, 8, {color:GS.world.palette.accent,speedMin:60,speedMax:200,lifeMin:0.2,lifeMax:0.5,sizeMin:2,sizeMax:5,upBias:50});
        if (e.hp <= 0) {
          e.alive = false;
          GS.score += 150;
          if (Math.random() < 0.25) GS.gems += randInt(1, 3);
          spawnParticles(ex+e.w/2, e.y+e.h/2, 16, {color:'#ffffff',speedMin:80,speedMax:300,lifeMin:0.3,lifeMax:0.7,sizeMin:2,sizeMax:6,upBias:80});
          updateHUD();
        }
      }
    }
  }
  // Clean up dead enemies
  GS.enemies = GS.enemies.filter(e => e.alive);
}

function rectsOverlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ── Boss Update ───────────────────────────────
function updateBoss(dt) {
  if (!GS.boss || GS.boss.dead) return;
  const boss = GS.boss;
  const p = GS.player;
  const fw = FLOOR_Y();
  const W = canvas.width;

  boss.t += dt;
  if (boss.hitFlash > 0) boss.hitFlash -= dt;

  // HP / tint
  const totalHits = boss.headHits + boss.bodyHits + boss.legHits;
  const hpPct = 1 - totalHits / (boss.headHP + boss.bodyHP + boss.legHP);
  boss.hp = hpPct * 100;
  boss.redTint = clamp(1 - hpPct, 0, 1);
  GS.screenDistortion = boss.redTint * 0.5;

  if (boss.dying) {
    boss.dyingTimer += dt;
    GS.screenDistortion = Math.min(1, boss.dyingTimer / 3);
    if (boss.dyingTimer > 3.5) { boss.dead = true; triggerBossDeath(); }
    return;
  }
  if (!boss.alive) return;

  // Puff spring
  boss.puffVel += (1 - boss.puffScale) * 38 * dt - boss.puffVel * 7 * dt;
  boss.puffScale += boss.puffVel * dt;
  boss.puffScale = clamp(boss.puffScale, 0.7, 1.5);

  // Gravity
  if (!boss.onGround) {
    boss.vy += 700 * dt;
    boss.y += boss.vy * dt;
    if (boss.y >= fw - boss.h) {
      boss.y = fw - boss.h;
      boss.vy = 0;
      boss.onGround = true;
      boss.puffScale = 1.22; boss.puffVel = -4;
      spawnParticles(boss.x - GS.cameraX + boss.w/2, fw, 10, {color:'#aaeeff',speedMin:40,speedMax:160,lifeMin:0.2,lifeMax:0.5,sizeMin:2,sizeMax:5});
    }
  }
  boss.x += boss.vx * dt;
  boss.x = clamp(boss.x, GS.cameraX + W * 0.05, GS.cameraX + W * 0.92);

  boss.phaseTimer += dt;
  const dx = p.x - boss.x;
  const dir = dx < 0 ? -1 : 1;

  // ── State machine ─────────────────────────
  if (boss.phase === 'approach') {
    boss.vx = lerp(boss.vx, dir * 55, 0.06);
    if (boss.onGround) boss.y = fw - boss.h;

    boss.orbCooldown -= dt;
    if (boss.orbCooldown <= 0) {
      boss.orbCooldown = 1.8;
      bossFireOrb(boss, p, 0);
    }

    if (boss.phaseTimer >= 4.0) {
      boss.phase = 'dance';
      boss.phaseTimer = 0;
      boss.danceT = 0;
      boss.danceFired = false;
      boss.vx = 0;
      boss.vy = -420;
      boss.onGround = false;
    }

  } else if (boss.phase === 'dance') {
    boss.danceT += dt;
    boss.vx = lerp(boss.vx, 0, 0.12);

    if (boss.onGround && !boss.danceFired && boss.danceT > 0.5) {
      boss.danceFired = true;
      bossFireOrb(boss, p, -0.28);
      bossFireOrb(boss, p,  0.0);
      bossFireOrb(boss, p,  0.28);
      boss.puffScale = 1.4; boss.puffVel = -6;
    }

    if (boss.danceT >= 2.5) {
      boss.approachCount++;
      if (boss.approachCount >= 3) {
        boss.phase = 'jump_over';
        boss.phaseTimer = 0;
        boss.approachCount = 0;
        const targetX = p.x + dir * (W * 0.48);
        boss.vx = clamp((targetX - boss.x) / 1.1, -600, 600);
        boss.vy = -540;
        boss.onGround = false;
      } else {
        boss.phase = 'approach';
        boss.phaseTimer = 0;
        boss.orbCooldown = 0.5;
      }
    }

  } else if (boss.phase === 'jump_over') {
    if (boss.onGround && boss.phaseTimer > 0.4) {
      boss.phase = 'approach';
      boss.phaseTimer = 0;
      boss.orbCooldown = 0.8;
      boss.vx = 0;
    }
  }

  // Update orbs
  for (const orb of boss.orbs) {
    if (!orb.alive) continue;
    orb.t += dt;
    orb.x += orb.vx * dt;
    orb.y += orb.vy * dt;
    if (orb.x < GS.cameraX - 120 || orb.x > GS.cameraX + W + 120 || orb.t > 5) { orb.alive = false; continue; }
    const ox = orb.x - GS.cameraX;
    const dist = Math.hypot(ox - (p.x - GS.cameraX + p.w/2), orb.y - (p.y + p.h/2));
    if (dist < orb.r + p.w * 0.35 && !p.isEvading) {
      takeDamage(12);
      orb.alive = false;
      spawnParticles(ox, orb.y, 8, {color:'#44ffee',speedMin:80,speedMax:260,lifeMin:0.2,lifeMax:0.5,sizeMin:2,sizeMax:5});
    }
  }
  boss.orbs = boss.orbs.filter(o => o.alive);

  // Melee hit
  if (p.attackHitbox) {
    const bsx = boss.x - GS.cameraX;
    if (rectsOverlap(p.attackHitbox, {x:bsx, y:boss.y, w:boss.w, h:boss.h})) {
      const ay = p.attackHitbox.y;
      const zone = ay < boss.y + boss.h*0.38 ? 'head' : ay < boss.y + boss.h*0.68 ? 'body' : 'legs';
      hitBossZone(boss, zone, bsx);
      p.attackHitbox = null; p.attackTimer = 0;
    }
  }

  // Contact damage
  const bsx = boss.x - GS.cameraX;
  if (rectsOverlap({x:bsx, y:boss.y, w:boss.w, h:boss.h}, {x:p.x-GS.cameraX+2, y:p.y, w:p.w-4, h:p.h}) && !p.isEvading) {
    takeDamage(9 * dt);
  }
}

function bossFireOrb(boss, p, angleOffset) {
  const dx = p.x - boss.x;
  const dy = (p.y + p.h/2) - (boss.y + boss.h*0.4);
  const len = Math.hypot(dx, dy) || 1;
  const speed = 115;
  const angle = Math.atan2(dy, dx) + angleOffset;
  boss.orbs.push({ x: boss.x + boss.w/2, y: boss.y + boss.h*0.4, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: 10, t: 0, alive: true });
}

function hitBossZone(boss, zone, bsx) {
  GS.score += 500;
  sfxHit();
  boss.hitFlash = 0.18; boss.hitFlashZone = zone;
  GS.screenCracks.push({ x:rand(0.1,0.9), y:rand(0.1,0.9), life:8, maxLife:8, angle:rand(0,Math.PI), len:rand(50,200) });
  if (zone === 'head') {
    boss.headHits++;
    spawnParticles(bsx+boss.w/2, boss.y+10, 12, {color:'#aaeeff',speedMin:100,speedMax:350,lifeMin:0.3,lifeMax:0.7,sizeMin:3,sizeMax:7,upBias:100});
    if (boss.headHits >= boss.headHP) { boss.alive=false; boss.dying=true; sfxBossDeath(); }
  } else if (zone === 'body') {
    boss.bodyHits++;
    spawnParticles(bsx+boss.w/2, boss.y+boss.h/2, 12, {color:'#ffffff',speedMin:80,speedMax:280,lifeMin:0.3,lifeMax:0.7,sizeMin:3,sizeMax:7});
    if (boss.bodyHits >= boss.bodyHP) { boss.alive=false; boss.dying=true; sfxBossDeath(); }
  } else {
    boss.legHits++;
    spawnParticles(bsx+boss.w/2, boss.y+boss.h-10, 10, {color:'#aaeeff',speedMin:60,speedMax:200,lifeMin:0.2,lifeMax:0.5,sizeMin:2,sizeMax:5});
    if (boss.legHits >= boss.legHP) { boss.alive=false; boss.dying=true; sfxBossDeath(); }
  }
  updateHUD();
}

function triggerBossDeath() {
  GS.score += 2000;
  sfxBossDeath();
  GS.state = 'boss_cinematic';
  const boss = GS.boss;
  GS.cinematic = {
    phase: 'head_fall',
    timer: 0,
    headX: boss ? (boss.x - GS.cameraX + boss.w/2 - 20) : canvas.width/2 - 20,
    headY: boss ? boss.y : FLOOR_Y() - 80,
    headVy: -180,
    blackAlpha: 0,
    beamAlpha: 0,
    beamH: 0,
    shipVisible: Math.random() < 0.003,
    settled: false,
  };
}

function updateCinematic(dt) {
  const c = GS.cinematic;
  if (!c) return;
  c.timer += dt;
  const fw = FLOOR_Y();

  if (c.phase === 'head_fall') {
    c.headVy += 700 * dt;
    c.headY += c.headVy * dt;
    if (c.headY + 36 >= fw) {
      c.headY = fw - 36;
      c.headVy = 0;
      c.settled = true;
    }
    if (c.settled && c.timer > 1.6) {
      c.phase = 'blackout';
      c.timer = 0;
    }
  } else if (c.phase === 'blackout') {
    c.blackAlpha = Math.min(1, c.timer / 0.9);
    if (c.timer > 1.1) {
      c.phase = 'beam_down';
      c.timer = 0;
      sfxBeam();
    }
  } else if (c.phase === 'beam_down') {
    c.beamH = Math.min(fw, (c.timer / 1.1) * fw);
    c.beamAlpha = Math.min(1, c.timer * 1.8);
    if (c.timer > 1.3) {
      c.phase = 'head_ascend';
      c.timer = 0;
      c.headVy = -120;
    }
  } else if (c.phase === 'head_ascend') {
    c.headVy -= 280 * dt;
    c.headY += c.headVy * dt;
    c.beamAlpha = Math.max(0, 1 - c.timer * 0.6);
    if (c.headY < -60) {
      c.phase = 'hold';
      c.timer = 0;
      c.beamAlpha = 0;
    }
  } else if (c.phase === 'hold') {
    if (c.timer > 1.4) {
      GS.level++;
      generateLevel();
      GS.state = 'playing';
      GS.worldReveal = 0;
      GS.worldNameFadeT = 0;
      GS.player.x = 120;
      GS.player.y = FLOOR_Y() - GS.player.h;
      GS.player.vx = 0;
      GS.player.vy = 0;
      GS.cameraX = 0;
      updateHUD();
    }
  }
}

function renderCinematic() {
  const W = canvas.width, H = canvas.height;
  const fw = FLOOR_Y();
  const c = GS.cinematic;
  if (!c) return;
  const pal = GS.world.palette;

  // World still visible until blackout
  if (c.blackAlpha < 1) {
    renderBackground(pal);
    renderFloor();
    renderPlatforms();
    renderParticles();
  }

  // Head resting / falling (visible until ascent phase)
  if (c.phase !== 'hold' && GS.boss && GS.boss.headSprite) {
    if (c.phase !== 'head_ascend' || c.headY < fw) {
      ctx.save();
      const hAlpha = c.phase === 'head_ascend' ? Math.max(0, 1 + c.headY / 60) : 1;
      ctx.globalAlpha = hAlpha;
      ctx.drawImage(GS.boss.headSprite, c.headX, c.headY, 40, 36);
      ctx.restore();
    }
  }

  // Black overlay
  if (c.blackAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${c.blackAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Beam of light
  if (c.beamAlpha > 0 && c.beamH > 0) {
    ctx.save();
    ctx.globalAlpha = c.beamAlpha * 0.55;
    const bx = c.headX + 20;
    const beamGrad = ctx.createLinearGradient(bx, 0, bx, c.beamH);
    beamGrad.addColorStop(0, 'rgba(255,255,220,0)');
    beamGrad.addColorStop(0.4, 'rgba(255,255,210,0.9)');
    beamGrad.addColorStop(1, 'rgba(255,240,180,0.3)');
    ctx.fillStyle = beamGrad;
    ctx.fillRect(bx - 12, 0, 24, c.beamH);
    // Wider soft glow
    ctx.globalAlpha = c.beamAlpha * 0.12;
    ctx.fillStyle = 'rgba(255,255,200,1)';
    ctx.fillRect(bx - 50, 0, 100, c.beamH);
    ctx.restore();
  }

  // Ascending head (over beam)
  if (c.phase === 'head_ascend' && GS.boss && GS.boss.headSprite) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 + c.headY / 60);
    ctx.drawImage(GS.boss.headSprite, c.headX, c.headY, 40, 36);
    ctx.restore();
  }

  // The Ship — appears briefly during hold at extremely low probability
  if (c.phase === 'hold' && c.shipVisible && c.timer > 0.2 && c.timer < 0.65) {
    const shipAlpha = Math.sin((c.timer - 0.2) / 0.45 * Math.PI) * 0.18;
    ctx.save();
    ctx.globalAlpha = shipAlpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    const sx = W * 0.6, sy = H * 0.22;
    ctx.beginPath();
    ctx.moveTo(sx, sy + 10);
    ctx.lineTo(sx + 40, sy + 10);
    ctx.lineTo(sx + 50, sy);
    ctx.lineTo(sx + 60, sy + 10);
    ctx.lineTo(sx + 80, sy + 10);
    ctx.lineTo(sx + 70, sy + 22);
    ctx.lineTo(sx + 10, sy + 22);
    ctx.closePath();
    ctx.stroke();
    ctx.moveTo(sx + 30, sy + 10);
    ctx.lineTo(sx + 35, sy - 8);
    ctx.lineTo(sx + 50, sy + 10);
    ctx.stroke();
    ctx.restore();
  }
}

// ── Dimensional Room ───────────────────────────
function enterDimensionalRoom() {
  sfxDimEnter();
  GS.state = 'dimensional';
  const dr = GS.dimRoom;
  dr.active = true;
  dr.wave = 0;
  dr.totalWaves = 3;
  dr.enemies = [];
  dr.phase = 'wave';
  dr.waveDelay = 0;
  dr.waveClearPending = false;
  dr.exitTimer = 0;
  dr.exitDoors = [];
  dr.drops = null;
  dr.creeperAlpha = 0;
  dr.creeperTimer = 0;
  spawnDimWave();
}

function spawnDimWave() {
  const dr = GS.dimRoom;
  dr.enemies = [];
  dr.waveClearPending = true;
  const pal = GS.world.palette;
  const cx = canvas.width/2, cy = canvas.height/2;

  // wave 0=heads, 1=torsos, 2=legs
  const waveTypes = [
    ['head','head','head'],
    ['torso','torso','torso'],
    ['legs','legs','legs'],
  ];
  const types = waveTypes[Math.min(dr.wave, 2)];

  for (let i=0; i<types.length; i++) {
    const type = types[i];
    const angle = (i/types.length) * Math.PI*2;
    const ew = type==='torso'?52:28, eh = type==='torso'?40:28;
    dr.enemies.push({
      type,
      x: clamp(cx + Math.cos(angle)*rand(150,220), 50, canvas.width-50-ew),
      y: clamp(cy + Math.sin(angle)*rand(80,180), 70, canvas.height-100-eh),
      vx: 0, vy: 0,
      w: ew,
      h: eh,
      hp: type==='torso'?4:2,
      hitFlash: 0,
      alive: true,
      orbit: null,
      sprite: genSprite(randInt(1,99999), type==='torso'?52:28, 28, pal),
    });
  }
}

function updateDimensionalRoom(dt) {
  const dr = GS.dimRoom;
  const p = GS.player;

  if (dr.phase === 'exit' || dr.phase === 'creeperfade') {
    dr.exitTimer = (dr.exitTimer || 0) + dt;

    // Physical drop collection
    if (dr.drops) {
      for (const drop of dr.drops) {
        if (!drop.alive) continue;
        drop.bobT += dt;
        if (rectsOverlap({x:p.x,y:p.y,w:p.w,h:p.h},{x:drop.x,y:drop.y,w:drop.w,h:drop.h})) {
          applyDimDrop(drop);
          drop.alive = false;
        }
      }
    }

    // Door interaction — walk into it after activation delay
    for (const door of dr.exitDoors) {
      door.activeIn = Math.max(0, (door.activeIn || 0) - dt);
      if (door.activeIn > 0) continue; // not active yet
      if (rectsOverlap({x:p.x,y:p.y,w:p.w,h:p.h},{x:door.x,y:door.y,w:door.w,h:door.h})) {
        door._t = (door._t || 0) + dt;
        if (door._t > 0.4) { exitDimensionalRoom(); return; }
      } else {
        door._t = 0;
      }
    }
    if (dr.exitTimer > 12) exitDimensionalRoom();
    return;
  }

  // creeperfade: tick alpha only; door/drop interaction handled in the block above
  if (dr.phase === 'creeperfade') {
    dr.creeperTimer += dt;
    dr.creeperAlpha = Math.min(1, dr.creeperAlpha + dt * 0.55);
    if (dr.creeperAlpha >= 1) dr.phase = 'exit';
  }

  // Inter-wave delay (replaces setTimeout — fully synchronous)
  if (dr.waveDelay > 0) {
    dr.waveDelay -= dt;
    if (dr.waveDelay <= 0) spawnDimWave();
    return;
  }

  // Wave combat
  for (const e of dr.enemies) {
    if (!e.alive) continue;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    const dx = p.x - e.x, dy = p.y - e.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const speed = e.type==='torso' ? 60 : (e.type==='head' ? 110 : 90);
    e.vx = (dx/dist)*speed;
    e.vy = (dy/dist)*speed;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.x = clamp(e.x, 40, canvas.width-40-e.w);
    e.y = clamp(e.y, 60, canvas.height-80-e.h);

    if (rectsOverlap({x:e.x,y:e.y,w:e.w,h:e.h},{x:p.x+2,y:p.y,w:p.w-4,h:p.h}) && !p.isEvading) {
      takeDamage(ENEMY_CONTACT_DMG);
    }
  }

  dr.enemies = dr.enemies.filter(e => e.alive);

  // waveClearPending is set by spawnDimWave — true means enemies were active this wave
  if (dr.waveClearPending && dr.enemies.length === 0) {
    dr.waveClearPending = false;
    dr.wave++;
    if (dr.wave >= dr.totalWaves) {
      // All waves done — spawn drops + door immediately, start creeper fade
      const W = canvas.width, H = canvas.height;
      const floorY = H - 80 - 26;
      const gunTypes = ['scatter','railgun','homing_spread'];
      const bonusType = Math.random() < 0.5 ? 'heart' : 'invincibility';
      dr.drops = [
        {x:W*0.32-13, y:floorY, w:26, h:20, type:pick(gunTypes), category:'gun', alive:true, bobT:0},
        {x:W*0.68-13, y:floorY, w:26, h:20, type:bonusType, category:'bonus', alive:true, bobT:0},
      ];
      dr.exitDoors = [{x:W*0.8-30, y:H-80-90, w:60, h:90, type:'exit', chosen:false, _t:0, activeIn:2.0}];
      dr.exitTimer = 0;
      dr.creeperAlpha = 0;
      dr.creeperTimer = 0;
      dr.phase = 'creeperfade'; // creeper fades in visually while door is already live
      GS.announceText = 'TAKE WHAT YOU WANT';
      GS.announceAlpha = 2.2;
    } else {
      const nextLabel = ['HEADS','TORSOS','LEGS'][dr.wave] || '';
      if (nextLabel) { GS.announceText = nextLabel; GS.announceAlpha = 1.5; }
      dr.waveDelay = 0.9;
    }
  }
}


function applyDimDrop(drop) {
  const p = GS.player;
  if (drop.category === 'gun') {
    const def = GUN_DEFS[drop.type];
    p.gun = { type: drop.type, ammo: def.ammo };
    GS.announceText = def.label;
  } else if (drop.type === 'heart') {
    p.hearts = Math.min(p.hearts + 1, p.maxHearts);
    GS.announceText = '+HEART';
    sfxHeart();
  } else {
    p.isGold = true;
    p.invBudget = p.invMax;
    GS.announceText = 'INVINCIBLE';
  }
  GS.announceAlpha = 1.8;
  spawnParticles(p.x+p.w/2, p.y, 16, {color:'#ffcc00',speedMin:80,speedMax:280,lifeMin:0.2,lifeMax:0.5,sizeMin:3,sizeMax:7});
  updateHUD();
}

function exitDimensionalRoom() {
  sfxDimEnter();
  GS.state = 'playing';
  GS.dimRoom.active = false;
  GS.dimDoorActive = false;
  updateHUD();
}

// ── Level Progression ─────────────────────────
function checkLevelComplete() {
  if (GS.distanceTraveled >= GS.distanceGoal && !GS.bossActive && !GS.boss) {
    GS.enemies = [];
    GS.enemySpawnTimer = 999;
    spawnBoss();
    GS.state = 'boss';
    GS.announceText = `LEVEL ${GS.level} — BOSS`;
    GS.announceAlpha = 1.5;
  }
}

// ── Game Over ─────────────────────────────────
function triggerGameOver() {
  GS.state = 'gameover';
  document.getElementById('touch-controls').classList.remove('tc-active');
  document.getElementById('final-score').textContent = GS.score.toLocaleString();
  document.getElementById('gameover-screen').classList.remove('hidden');
}

// ── Particles Update ──────────────────────────
function updateParticles(dt) {
  for (const p of GS.particles) {
    if (!p.active) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) p.active = false;
  }
  if (GS.particles.length > 600) GS.particles = GS.particles.filter(p=>p.active).slice(-400);
}

// ── Dim Door Check ─────────────────────────────
function checkDimDoor(dt) {
  if (!GS.dimDoorActive || !GS.dimDoor) return;
  const p = GS.player;
  const door = GS.dimDoor;
  const pBox = {x:p.x-2, y:p.y, w:p.w+4, h:p.h};
  const dBox = {x:door.x-20, y:door.y-30, w:door.w+40, h:door.h+60};
  const overlap = rectsOverlap(pBox, dBox);

  const holdingUp   = Keys.held['ArrowUp']   || Keys.held['KeyW'];
  const movingSide  = Keys.held['ArrowLeft']  || Keys.held['KeyA'] || Keys.held['ArrowRight'] || Keys.held['KeyD'];

  if (overlap && holdingUp && !movingSide) {
    enterDimensionalRoom();
  }
}

// ── Dimensional Room Player Physics ───────────
function updatePlayerDim(dt) {
  const p = GS.player;
  const W = canvas.width, H = canvas.height;

  if (p.attackTimer > 0) p.attackTimer -= dt;
  if (p.flashTimer > 0) p.flashTimer -= dt;
  if (p.attackTimer <= 0) p.attackHitbox = null;

  const left  = Keys.held['KeyA'] || Keys.held['ArrowLeft'];
  const right = Keys.held['KeyD'] || Keys.held['ArrowRight'];
  const up    = Keys.held['KeyW'] || Keys.held['ArrowUp'];
  const down  = Keys.held['KeyS'] || Keys.held['ArrowDown'];

  if (left)  { p.vx = lerp(p.vx, -PLAYER_SPEED, 0.35); p.facing = -1; }
  if (right) { p.vx = lerp(p.vx,  PLAYER_SPEED, 0.35); p.facing =  1; }
  if (!left && !right) p.vx = lerp(p.vx, 0, 0.3);
  if (up)    { p.vy = lerp(p.vy, -PLAYER_SPEED, 0.35); }
  if (down)  { p.vy = lerp(p.vy,  PLAYER_SPEED, 0.35); }
  if (!up && !down) p.vy = lerp(p.vy, 0, 0.3);

  if (p.gunCooldown > 0) p.gunCooldown -= dt;
  const pbChaseDim = p.gun?.type === 'particle_blaster' && (Keys.held['KeyJ'] || Keys.held['KeyZ']);
  if (Keys.just['KeyJ'] || Keys.just['KeyZ'] || attackBuffer || pbChaseDim) {
    attackBuffer = false;
    fireGun();
  }

  p.x += p.vx * dt;
  p.y += p.vy * dt;
  p.x = clamp(p.x, 30, W - 30 - p.w);
  p.y = clamp(p.y, 60, H - 80 - p.h);
}

// ── RENDERING ─────────────────────────────────

function renderBackground(pal) {
  const W = canvas.width, H = canvas.height;
  const fw = FLOOR_Y();

  // Sky gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, pal.sky);
  grad.addColorStop(0.7, pal.bg);
  grad.addColorStop(1, darken(pal.ground, 0.3));
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Harvest moon
  const moonX = W * 0.68 - GS.cameraX * 0.018;
  const moonY = H * 0.17;
  const moonR  = Math.max(28, H * 0.082);
  ctx.save();
  const mgr = ctx.createRadialGradient(moonX, moonY, moonR * 0.75, moonX, moonY, moonR * 3.0);
  mgr.addColorStop(0,    'rgba(255,130,20,0.42)');
  mgr.addColorStop(0.45, 'rgba(255,80,10,0.14)');
  mgr.addColorStop(1,    'rgba(255,60,0,0)');
  ctx.fillStyle = mgr;
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 3.0, 0, Math.PI*2); ctx.fill();
  const mdisc = ctx.createRadialGradient(moonX - moonR*0.28, moonY - moonR*0.28, 0, moonX, moonY, moonR);
  mdisc.addColorStop(0,    '#ffd070');
  mdisc.addColorStop(0.55, '#ff9922');
  mdisc.addColorStop(1,    '#bb4400');
  ctx.fillStyle = mdisc;
  ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI*2); ctx.fill();
  const cRng = mulberry32(1337);
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  for (let i = 0; i < 6; i++) {
    const ca = cRng()*Math.PI*2, cd = cRng()*moonR*0.65, cr = moonR*(0.06 + cRng()*0.1);
    ctx.beginPath(); ctx.arc(moonX + Math.cos(ca)*cd, moonY + Math.sin(ca)*cd, cr, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Stars
  const offsetMid = GS.cameraX * 0.15;
  ctx.globalAlpha = 0.13;
  ctx.fillStyle = pal.accent;
  const rngB = mulberry32(Math.floor(GS.level*17 + 3));
  for (let i=0;i<40;i++) {
    const bx = ((rngB()*W*3 - offsetMid) % (W*1.5) + W*1.5) % (W*1.5) - W*0.25;
    const by = rngB()*H*0.7;
    const bs = rngB()*3+1;
    ctx.fillRect(bx, by, bs, bs);
  }
  ctx.globalAlpha = 1;

  // Far mountains (parallax 0.07)
  {
    const tileW = W * 2.2;
    const offX  = GS.cameraX * 0.07;
    const startX = -(offX % tileW);
    const rngM = mulberry32(GS.level * 41 + 11);
    const peakN = 14;
    const pts = [];
    for (let i = 0; i <= peakN; i++) {
      const px = (i / peakN) * tileW + (rngM() - 0.5) * (tileW / peakN) * 0.4;
      const py = fw - H * (0.16 + rngM() * 0.22);
      pts.push({ x: clamp(px, 0, tileW), y: py });
    }
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    for (let copy = 0; copy <= 1; copy++) {
      const ox = startX + copy * tileW;
      if (ox > W + 10 || ox + tileW < -10) continue;
      ctx.beginPath();
      ctx.moveTo(ox, H + 2);
      ctx.lineTo(ox + pts[0].x, pts[0].y);
      for (const pt of pts) ctx.lineTo(ox + pt.x, pt.y);
      ctx.lineTo(ox + tileW, H + 2);
      ctx.closePath(); ctx.fill();
    }
  }

  // Near hills (parallax 0.16)
  {
    const tileW = W * 1.8;
    const offX  = GS.cameraX * 0.16;
    const startX = -(offX % tileW);
    const rngN = mulberry32(GS.level * 53 + 19);
    const peakN = 10;
    const pts = [];
    for (let i = 0; i <= peakN; i++) {
      const px = (i / peakN) * tileW + (rngN() - 0.5) * (tileW / peakN) * 0.35;
      const py = fw - H * (0.07 + rngN() * 0.13);
      pts.push({ x: clamp(px, 0, tileW), y: py });
    }
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    for (let copy = 0; copy <= 1; copy++) {
      const ox = startX + copy * tileW;
      if (ox > W + 10 || ox + tileW < -10) continue;
      ctx.beginPath();
      ctx.moveTo(ox, H + 2);
      ctx.lineTo(ox + pts[0].x, pts[0].y);
      for (const pt of pts) ctx.lineTo(ox + pt.x, pt.y);
      ctx.lineTo(ox + tileW, H + 2);
      ctx.closePath(); ctx.fill();
    }
  }

  // Silhouette trees (parallax 0.28)
  {
    const tileW  = W * 1.4;
    const offX   = GS.cameraX * 0.28;
    const startX = -(offX % tileW);
    const rngT   = mulberry32(GS.level * 67 + 23);
    const trees  = [];
    for (let x = 0; x < tileW; ) {
      x += rngT() * 72 + 28;
      const h    = H * (0.08 + rngT() * 0.1);
      const type = rngT() < 0.22 ? 'bare' : 'pine';
      trees.push({ x, h, type });
    }
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.strokeStyle = 'rgba(0,0,0,0.78)';
    ctx.lineCap = 'round';
    for (let copy = 0; copy <= 1; copy++) {
      const ox = startX + copy * tileW;
      if (ox > W + 150 || ox + tileW < -150) continue;
      for (const tree of trees) {
        const tx = ox + tree.x;
        if (tx < -100 || tx > W + 100) continue;
        const base = fw;
        const tip  = base - tree.h;
        if (tree.type === 'pine') {
          const layers = 3;
          for (let l = 0; l < layers; l++) {
            const lf  = l / layers;
            const ly  = tip + tree.h * lf * 0.68;
            const lw  = tree.h * (0.40 - lf * 0.08);
            const bot = tip + tree.h * ((l + 1) / layers) * 0.72;
            ctx.beginPath();
            ctx.moveTo(tx, ly);
            ctx.lineTo(tx - lw, bot);
            ctx.lineTo(tx + lw, bot);
            ctx.closePath(); ctx.fill();
          }
          // Trunk
          ctx.fillRect(tx - tree.h*0.045, base - tree.h*0.18, tree.h*0.09, tree.h*0.18);
        } else {
          // Bare / dead tree
          const tw = tree.h * 0.065;
          ctx.fillRect(tx - tw/2, tip, tw, tree.h);
          ctx.lineWidth = tw * 0.55;
          for (let b = 0; b < 4; b++) {
            const bY  = tip + tree.h * (0.18 + b * 0.14);
            const bDx = (b % 2 === 0 ? 1 : -1) * tree.h * 0.24;
            ctx.beginPath();
            ctx.moveTo(tx, bY);
            ctx.lineTo(tx + bDx, bY - tree.h * 0.13);
            ctx.stroke();
          }
        }
      }
    }
  }
}

function renderPlatforms() {
  const pal = GS.world.palette;
  for (const pl of GS.platforms) {
    const sx = pl.x - GS.cameraX;
    if (sx > canvas.width + 20 || sx + pl.w < -20) continue;
    // Platform body
    ctx.fillStyle = pl.color;
    ctx.fillRect(sx, pl.y, pl.w, pl.h);
    // Top highlight
    ctx.fillStyle = lighten(pl.color, 0.3);
    ctx.fillRect(sx, pl.y, pl.w, 3);
    // Bottom shadow
    ctx.fillStyle = darken(pl.color, 0.4);
    ctx.fillRect(sx, pl.y+pl.h-3, pl.w, 3);
  }
}

function renderFloor() {
  const pal = GS.world.palette;
  const W = canvas.width, H = canvas.height;
  const fw = FLOOR_Y();

  // Build solid floor segments by subtracting pit gaps from visible range
  const visStart = GS.cameraX;
  const visEnd = GS.cameraX + W;
  const relevantPits = GS.pits.filter(p => p.x + p.w > visStart && p.x < visEnd);
  relevantPits.sort((a, b) => a.x - b.x);

  const fGrad = ctx.createLinearGradient(0, fw, 0, H);
  fGrad.addColorStop(0, pal.ground);
  fGrad.addColorStop(0.15, darken(pal.ground, 0.3));
  fGrad.addColorStop(1, '#000');

  let curWorld = visStart;
  const drawSeg = (worldA, worldB) => {
    if (worldB <= worldA) return;
    const sx = worldA - GS.cameraX;
    const sw = worldB - worldA;
    ctx.fillStyle = fGrad;
    ctx.fillRect(sx, fw, sw, H - fw);
    ctx.fillStyle = lighten(pal.ground, 0.2);
    ctx.fillRect(sx, fw, sw, 3);
    // Pit edge walls — dark drop-off on both sides of each gap
    ctx.fillStyle = darken(pal.ground, 0.5);
    ctx.fillRect(sx + sw - 4, fw, 4, H - fw);
    ctx.fillRect(sx, fw, 4, H - fw);
  };

  for (const pit of relevantPits) {
    drawSeg(curWorld, pit.x);
    // Draw dark void inside pit
    ctx.fillStyle = '#000';
    const ps = Math.max(0, pit.x - GS.cameraX);
    const pe = Math.min(W, pit.x + pit.w - GS.cameraX);
    ctx.fillRect(ps, fw, pe - ps, H - fw);
    curWorld = pit.x + pit.w;
  }
  drawSeg(curWorld, visEnd);

  // Spikes
  for (const sp of GS.spikes) {
    const sx = sp.x - GS.cameraX;
    if (sx > W + 20 || sx + sp.w < -20) continue;
    ctx.fillStyle = '#c8c8c8';
    const count = 5;
    const sw = sp.w / count;
    for (let i=0;i<count;i++) {
      ctx.beginPath();
      ctx.moveTo(sx + i*sw, sp.y + sp.h);
      ctx.lineTo(sx + i*sw + sw/2, sp.y);
      ctx.lineTo(sx + i*sw + sw, sp.y + sp.h);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function renderDimDoor() {
  if (!GS.dimDoorActive || !GS.dimDoor) return;
  const door = GS.dimDoor;
  const sx = door.x - GS.cameraX;
  if (sx < -60 || sx > canvas.width + 60) return;

  // Fade signal based on level (GDD: early=clear, late=shimmer)
  const alpha = Math.max(0.05, 1 - GS.level * 0.08) * (0.6 + 0.4*Math.sin(GS.levelTimer*3));

  ctx.save();
  ctx.globalAlpha = alpha;
  // Door frame
  ctx.strokeStyle = GS.world.palette.accent;
  ctx.lineWidth = 3;
  ctx.shadowColor = GS.world.palette.accent;
  ctx.shadowBlur = 20;
  ctx.strokeRect(sx, door.y, door.w, door.h);
  // Inner glow
  const grad = ctx.createLinearGradient(sx, door.y, sx, door.y+door.h);
  grad.addColorStop(0, GS.world.palette.accent+'40');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(sx+3, door.y+3, door.w-6, door.h-6);
  // UP arrow hint
  ctx.fillStyle = GS.world.palette.accent;
  ctx.font = 'bold 11px Chakra Petch, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('↑', sx + door.w/2, door.y - 8);
  ctx.restore();
}

function renderPlayer() {
  const p = GS.player;
  const px = (GS.state === 'dimensional') ? p.x : p.x;
  const camX = (GS.state === 'dimensional') ? 0 : GS.cameraX;
  const sx = px - camX;

  // Flash (i-frames)
  if (p.flashTimer > 0 && Math.floor(p.flashTimer*12)%2===1) return;

  ctx.save();

  // Gold tint if invincible
  if (p.isGold) {
    ctx.shadowColor = '#f5c842';
    ctx.shadowBlur = 12;
  }

  // Draw sprite or fallback rectangle
  if (p.sprite) {
    ctx.save();
    if (p.facing < 0) {
      ctx.translate(sx + p.w, p.y);
      ctx.scale(-1, 1);
      ctx.drawImage(p.sprite, 0, 0, p.w, p.h);
    } else {
      ctx.drawImage(p.sprite, sx, p.y, p.w, p.h);
    }
    ctx.restore();
  } else {
    ctx.fillStyle = '#e8e8ec';
    ctx.fillRect(sx, p.y, p.w, p.h);
  }

  // Attack flash
  if (p.attackTimer > 0) {
    const atype = p.attackHitbox?.type;
    ctx.strokeStyle = atype==='spin' ? GS.world.palette.accent : '#ffffff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = p.attackTimer * 4;
    const aw = p.w * (atype==='spin' ? 1.6 : 1.2);
    const ax = p.facing > 0 ? sx + p.w : sx - aw;
    ctx.strokeRect(ax, p.y+4, aw, p.h-8);
    ctx.globalAlpha = 1;
  }

  // Dash trail
  if (p.isDashing) {
    for (let i=1;i<=3;i++) {
      ctx.globalAlpha = 0.15 * (4-i);
      ctx.fillStyle = '#aaaaff';
      ctx.fillRect(sx - p.vx*0.003*i, p.y, p.w, p.h);
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawEnemyHead(ctx, x, y, w, h, pal, flash) {
  const cx = x + w/2, cy = y + h/2;
  const rx = w * 0.44, ry = h * 0.46;
  // Skull shape
  ctx.fillStyle = flash > 0 ? '#fff' : darken(pal.accent, 0.2);
  ctx.beginPath();
  ctx.ellipse(cx, cy - h*0.05, rx, ry, 0, 0, Math.PI*2);
  ctx.fill();
  // Jaw — flat bottom
  ctx.fillStyle = flash > 0 ? '#fff' : darken(pal.accent, 0.4);
  ctx.fillRect(cx - rx*0.55, cy + ry*0.35, rx*1.1, ry*0.45);
  // Eye sockets
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx - w*0.17, cy - h*0.08, w*0.11, h*0.13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + w*0.17, cy - h*0.08, w*0.11, h*0.13, 0, 0, Math.PI*2);
  ctx.fill();
  // Glowing pupils
  ctx.fillStyle = flash > 0 ? '#fff' : pal.accent;
  ctx.shadowColor = pal.accent;
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.arc(cx - w*0.17, cy - h*0.08, w*0.055, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + w*0.17, cy - h*0.08, w*0.055, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Teeth
  ctx.fillStyle = flash > 0 ? '#aaa' : 'rgba(255,255,255,0.7)';
  const tw = rx*0.18, th = ry*0.22, tx0 = cx - rx*0.4;
  for (let i=0; i<3; i++) {
    ctx.fillRect(tx0 + i*(tw+2), cy + ry*0.35, tw, th);
  }
}

function drawEnemyLegs(ctx, x, y, w, h, pal, flash, enemy) {
  const t = enemy ? GS.levelTimer + enemy.seed * 0.0001 : GS.levelTimer;
  const moving = !enemy || enemy.blobPhase === 'move';
  // Squish: stretched horizontal when moving, compressed vertical when paused
  const sqX = moving ? (1.18 + 0.04*Math.sin(t*14)) : (0.82 + 0.04*Math.sin(t*9));
  const sqY = moving ? 0.8 : (1.12 + 0.08*Math.sin(t*9));
  const cx = x + w/2;
  const cy = y + h * (moving ? 0.62 : 0.52);
  const rx = w * 0.44 * sqX;
  const ry = h * 0.44 * sqY;
  const col = flash > 0 ? '#ffffff' : pal.accent;

  ctx.save();

  // Outer halo
  ctx.shadowColor = pal.accent;
  ctx.shadowBlur = 22 + 8*Math.sin(t*3.2);
  ctx.fillStyle = col + '38';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx*1.45, ry*1.45, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill();

  // Inner radial highlight
  ctx.shadowBlur = 0;
  const grad = ctx.createRadialGradient(cx - rx*0.22, cy - ry*0.22, 0, cx, cy, Math.max(rx, ry)*0.95);
  grad.addColorStop(0, 'rgba(255,255,255,0.7)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.08)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill();

  // Eyes
  const eyeOff = rx * 0.3;
  const eyeY = cy - ry*0.16;
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(cx - eyeOff, eyeY, rx*0.14, ry*0.17, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeOff, eyeY, rx*0.14, ry*0.17, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(cx - eyeOff, eyeY, rx*0.065, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + eyeOff, eyeY, rx*0.065, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Orbiting sparkles
  const sc = 6;
  for (let i = 0; i < sc; i++) {
    const angle = (i/sc)*Math.PI*2 + t*1.9;
    const dist = Math.max(rx, ry) * (1.18 + 0.14*Math.sin(t*4.2 + i));
    const alpha = 0.35 + 0.65*Math.abs(Math.sin(t*5.5 + i*1.2));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff'; ctx.shadowColor = pal.accent; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.arc(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist*0.65, 1.8, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemyTorso(ctx, x, y, w, h, pal, flash, enemy) {
  const t = enemy ? GS.levelTimer + enemy.seed * 0.0001 : GS.levelTimer;
  const cx = x + w/2;
  const base = flash > 0 ? '#fff' : pal.accent;
  const dk   = flash > 0 ? '#ccc' : darken(pal.accent, 0.4);
  const lt   = flash > 0 ? '#fff' : lighten(pal.accent, 0.35);

  ctx.save();

  // --- Segmented body (lower 52%) ---
  const bodyPulse = 1 + 0.03*Math.sin(t*3.6);
  const bodyW = w * 0.46 * bodyPulse;
  const bodyTop = y + h*0.44;
  const bodyH = h * 0.52;
  ctx.shadowColor = pal.accent; ctx.shadowBlur = 8;
  ctx.fillStyle = base;
  ctx.beginPath(); ctx.ellipse(cx, bodyTop + bodyH/2, bodyW/2, bodyH/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = dk;
  for (let i = 1; i < 4; i++) {
    const sy = bodyTop + bodyH*(i/4) - 1;
    const segW = bodyW*(0.9 - 0.12*Math.abs(i - 1.5));
    ctx.fillRect(cx - segW/2 + 2, sy, segW - 4, 2);
  }

  // --- Arms (2, animated swing) ---
  ctx.lineWidth = 3;
  for (let side = -1; side <= 1; side += 2) {
    const ap = t*2.6 + (side > 0 ? Math.PI : 0);
    const sx2 = cx + side * bodyW/2;
    const sy2 = bodyTop + bodyH*0.22;
    const ex2 = sx2 + side*(w*0.28 + w*0.07*Math.sin(ap));
    const ey2 = sy2 + h*0.08*Math.sin(ap + 0.6) - h*0.03;
    const hx = ex2 + side*w*0.1;
    const hy = ey2 + h*0.13 + h*0.05*Math.cos(ap);
    ctx.strokeStyle = dk; ctx.shadowColor = pal.accent; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.moveTo(sx2, sy2); ctx.quadraticCurveTo(ex2, ey2, hx, hy); ctx.stroke();
    ctx.fillStyle = base; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(hx, hy, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = lt; ctx.lineWidth = 1.5;
    for (let c = -1; c <= 1; c++) {
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + side*5 + c*3, hy + 5); ctx.stroke();
    }
    ctx.lineWidth = 3;
  }

  // --- Head (top 48%) ---
  const hcx = cx, hcy = y + h*0.22;
  const hrx = w*0.3, hry = h*0.24;
  ctx.shadowColor = pal.accent; ctx.shadowBlur = 10;
  ctx.fillStyle = base;
  ctx.beginPath(); ctx.ellipse(hcx, hcy, hrx, hry, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Big almond eyes
  const eox = hrx*0.44, eoy = hcy - hry*0.05;
  ctx.fillStyle = '#080808';
  ctx.beginPath(); ctx.ellipse(hcx - eox, eoy, hrx*0.33, hry*0.43, -0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hcx + eox, eoy, hrx*0.33, hry*0.43,  0.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = lt; ctx.shadowColor = lt; ctx.shadowBlur = 10 + 4*Math.sin(t*4.8);
  ctx.beginPath(); ctx.arc(hcx - eox, eoy, hrx*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hcx + eox, eoy, hrx*0.13, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Mouth — slit that opens and shows teeth
  const mOpen = Math.max(1.2, Math.sin(t*2.3) * hry*0.28);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(hcx, hcy + hry*0.52, hrx*0.44, mOpen, 0, 0, Math.PI*2); ctx.fill();
  if (mOpen > 3) {
    ctx.fillStyle = 'rgba(255,255,255,0.78)';
    for (let i = 0; i < 4; i++) {
      const tx = hcx - hrx*0.34 + i*hrx*0.22;
      const ty = hcy + hry*0.52;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + hrx*0.08, ty + mOpen*0.9); ctx.lineTo(tx + hrx*0.16, ty); ctx.fill();
    }
  }

  // Antennae
  ctx.lineWidth = 1.5;
  for (let side = -1; side <= 1; side += 2) {
    const abx = hcx + side*hrx*0.28, aby = hcy - hry*0.88;
    const atx = abx + side*hrx*0.38 + Math.sin(t*3.2 + side)*4;
    const aty = aby - h*0.17;
    ctx.strokeStyle = base; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(abx, aby); ctx.quadraticCurveTo(abx + side*hrx*0.22, aby - h*0.09, atx, aty); ctx.stroke();
    ctx.fillStyle = lt; ctx.shadowColor = lt; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(atx, aty, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function renderEnemy(e) {
  const camX = (GS.state === 'dimensional') ? 0 : GS.cameraX;
  const sx = e.x - camX;
  if (sx < -e.w - 10 || sx > canvas.width + 10) return;

  ctx.save();
  if (e.hitFlash > 0) {
    ctx.globalAlpha = 0.5;
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 8;
  }
  const pal = GS.world.palette;
  if (e.type === 'head') {
    drawEnemyHead(ctx, sx, e.y, e.w, e.h, pal, e.hitFlash);
  } else if (e.type === 'legs') {
    drawEnemyLegs(ctx, sx, e.y, e.w, e.h, pal, e.hitFlash, e);
  } else {
    drawEnemyTorso(ctx, sx, e.y, e.w, e.h, pal, e.hitFlash, e);
  }
  ctx.restore();
}

function renderBoss() {
  if (!GS.boss || GS.boss.dead) return;
  const boss = GS.boss;
  const sx = boss.x - GS.cameraX;
  const t = boss.t;

  ctx.save();

  // Orbs
  for (const orb of boss.orbs) {
    const ox = orb.x - GS.cameraX;
    ctx.save();
    ctx.shadowColor = '#44ffee'; ctx.shadowBlur = 18 + 6*Math.sin(orb.t*8);
    const og = ctx.createRadialGradient(ox, orb.y, 0, ox, orb.y, orb.r);
    og.addColorStop(0, '#ffffff'); og.addColorStop(0.4, '#aaffee'); og.addColorStop(1, '#0077ee');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(ox, orb.y, orb.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#88ffee'; ctx.lineWidth = 1.2; ctx.shadowBlur = 5;
    for (let i = 0; i < 4; i++) {
      const a = orb.t*5 + i*Math.PI/2;
      const d = orb.r*(1.35 + 0.3*Math.sin(orb.t*9+i));
      ctx.beginPath(); ctx.moveTo(ox+Math.cos(a)*orb.r*0.7, orb.y+Math.sin(a)*orb.r*0.7);
      ctx.lineTo(ox+Math.cos(a)*d, orb.y+Math.sin(a)*d); ctx.stroke();
    }
    ctx.restore();
  }

  // Blob — cyberpunk pink/purple
  const bw = boss.w, bh = boss.h;
  const ps = boss.puffScale;
  const bobY = boss.onGround ? Math.sin(t*3.2)*2 : 0;
  const cx2 = sx + bw/2;
  const by = boss.y + bobY;
  const bcx = cx2, bcy = by + bh*0.5;
  const isFlash = boss.hitFlash > 0;
  const cpPink   = '#ff22aa';
  const cpPurple = '#aa00ff';
  const cpDeep   = '#1a003a';
  const cpCyan   = '#00ffee';
  const cpMid    = '#cc00dd';
  const glowCol  = boss.redTint > 0.5 ? '#ff3300' : cpPink;
  const blobDark = isFlash ? '#ffffff' : cpDeep;
  const brx = bw*0.42, bry = bh*0.42; // base blob radii

  // Build Catmull-Rom blob control points
  const BN = 12;
  const bpts = [];
  for (let i = 0; i < BN; i++) {
    const a = (i/BN)*Math.PI*2;
    const w = 1 + 0.17*Math.sin(t*2.8+i*1.1) + 0.08*Math.sin(t*5.1+i*0.7);
    bpts.push({ x: bcx + Math.cos(a)*brx*w*ps, y: bcy + Math.sin(a)*bry*w*ps });
  }

  ctx.shadowColor = glowCol;
  ctx.shadowBlur = 30 + 14*Math.sin(t*2.1);

  // ── Tentacles (drawn first so body covers their roots) ──
  ctx.lineCap = 'round';
  const tentDefs = [
    { bx: bcx - brx*0.85, by2: bcy - bh*0.08, fq: 2.4, ph: 0   },
    { bx: bcx + brx*0.85, by2: bcy - bh*0.08, fq: 2.9, ph: 1.8  },
    { bx: bcx,            by2: bcy - bry*0.9,  fq: 3.3, ph: 3.6  },
  ];
  for (const td of tentDefs) {
    const sw  = Math.sin(t*td.fq + td.ph);
    const sw2 = Math.sin(t*td.fq*1.4 + td.ph + 1.2);
    const side = td.bx < bcx ? -1 : td.bx > bcx ? 1 : 0;
    const mx  = td.bx + (side !== 0 ? side*bw*0.52 + sw2*bw*0.28 : sw*bw*0.48);
    const my2 = td.by2 + (side !== 0 ? sw*bh*0.3 - bh*0.08 : -bh*0.32 + sw2*bh*0.18);
    const tx2 = mx + (side !== 0 ? side*bw*0.32 + sw*bw*0.22 : sw2*bw*0.42);
    const ty2 = my2 + (side !== 0 ? sw2*bh*0.28 - bh*0.04 : -bh*0.2 + sw*bh*0.16);
    ctx.shadowBlur = 12;
    ctx.lineWidth = bw*0.1;
    ctx.strokeStyle = blobDark;
    ctx.beginPath(); ctx.moveTo(td.bx, td.by2);
    ctx.quadraticCurveTo(mx, my2, tx2, ty2); ctx.stroke();
    ctx.lineWidth = bw*0.038;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(td.bx, td.by2);
    ctx.quadraticCurveTo(mx, my2, tx2, ty2); ctx.stroke();
    ctx.shadowColor = cpCyan; ctx.shadowBlur = 16;
    ctx.fillStyle = isFlash ? '#ffffff' : cpCyan;
    ctx.beginPath(); ctx.arc(tx2, ty2, bw*0.075, 0, Math.PI*2); ctx.fill();
  }

  // ── Blob body ──
  ctx.shadowColor = glowCol; ctx.shadowBlur = 30 + 14*Math.sin(t*2.1);
  ctx.beginPath();
  for (let i = 0; i < BN; i++) {
    const p0=bpts[(i-1+BN)%BN], p1=bpts[i], p2=bpts[(i+1)%BN], p3=bpts[(i+2)%BN];
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    if (i===0) ctx.moveTo(p1.x, p1.y);
    ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2.x, p2.y);
  }
  ctx.closePath();
  const bg = ctx.createRadialGradient(bcx-bw*0.1, bcy-bh*0.14, bh*0.04, bcx, bcy, Math.max(bw,bh)*0.54);
  bg.addColorStop(0,   isFlash ? '#ffffff' : cpPink);
  bg.addColorStop(0.45,isFlash ? '#ffaaff' : cpMid);
  bg.addColorStop(0.8, isFlash ? '#cc88ff' : cpPurple);
  bg.addColorStop(1,   isFlash ? '#8844cc' : cpDeep);
  ctx.fillStyle = bg;
  ctx.fill();

  // Surface sheen
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.11)';
  ctx.beginPath(); ctx.ellipse(bcx-bw*0.1, bcy-bh*0.13, bw*0.16, bh*0.09, -0.3, 0, Math.PI*2); ctx.fill();

  // ── Drips ──
  ctx.shadowColor = glowCol; ctx.shadowBlur = 8;
  for (let d = 0; d < 4; d++) {
    const da = Math.PI*0.22 + (d/3)*Math.PI*0.56;
    const dAmp = (Math.sin(t*1.3 + d*1.9) + 1)*0.5;
    const dLen = bh*(0.07 + 0.13*dAmp);
    const dBx  = bcx + Math.cos(da + Math.PI*0.5)*brx*0.82;
    const dBy2 = bcy + Math.sin(da + Math.PI*0.5)*bry*0.88;
    const dr2  = bw*0.034;
    ctx.fillStyle = isFlash ? '#ffffff' : cpPink;
    ctx.beginPath();
    ctx.arc(dBx, dBy2, dr2, Math.PI, 0);
    ctx.bezierCurveTo(dBx+dr2, dBy2+dLen*0.6, dBx+dr2*0.3, dBy2+dLen, dBx, dBy2+dLen);
    ctx.bezierCurveTo(dBx-dr2*0.3, dBy2+dLen, dBx-dr2, dBy2+dLen*0.6, dBx-dr2, dBy2);
    ctx.closePath(); ctx.fill();
  }

  // ── Eyes ──
  ctx.shadowBlur = 0;
  const eyeSep = bw*0.21;
  for (let side = -1; side <= 1; side += 2) {
    const ex = bcx + side*eyeSep;
    const ey = bcy - bh*0.1 + Math.sin(t*1.8+side*0.5)*bh*0.025;
    ctx.fillStyle = '#030303';
    ctx.beginPath(); ctx.ellipse(ex, ey, bw*0.1, bh*0.088, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor = cpCyan; ctx.shadowBlur = 16;
    ctx.fillStyle = isFlash ? '#ffffff' : cpCyan;
    ctx.beginPath(); ctx.ellipse(ex, ey, bw*0.052, bh*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.arc(ex-bw*0.024, ey-bh*0.022, bw*0.017, 0, Math.PI*2); ctx.fill();
  }

  // ── Orbiting energy motes ──
  for (let i = 0; i < 6; i++) {
    const ang = (i/6)*Math.PI*2 + t*1.8;
    const mR = bw*0.58 + bw*0.1*Math.sin(t*3.3+i);
    const al = 0.3 + 0.7*Math.abs(Math.sin(t*5.5+i*1.4));
    ctx.globalAlpha = al;
    const moteCol = i % 2 === 0 ? cpPink : cpCyan;
    ctx.shadowColor = moteCol; ctx.shadowBlur = 10;
    ctx.fillStyle = moteCol;
    ctx.beginPath(); ctx.arc(bcx+Math.cos(ang)*mR, bcy+Math.sin(ang)*mR*0.52, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // Hit flash
  if (isFlash) {
    const fa = (boss.hitFlash/0.18)*0.4;
    ctx.fillStyle = `rgba(180,230,255,${fa})`;
    ctx.beginPath(); ctx.ellipse(cx2, by+bh*0.5, bw*0.55, bh*0.52, 0, 0, Math.PI*2); ctx.fill();
  }

  // HP pips
  const pipZones = [
    { hits:boss.headHits, hp:boss.headHP, y:by+bh*0.18, d:boss.headHits>=boss.headHP },
    { hits:boss.bodyHits, hp:boss.bodyHP, y:by+bh*0.52, d:boss.bodyHits>=boss.bodyHP },
    { hits:boss.legHits,  hp:boss.legHP,  y:by+bh*0.85, d:boss.legHits>=boss.legHP },
  ];
  for (const z of pipZones) {
    for (let i = 0; i < z.hp; i++) {
      const px2 = sx + boss.w + 10 + i*9;
      ctx.beginPath(); ctx.arc(px2, z.y, 3, 0, Math.PI*2);
      ctx.fillStyle = z.d ? 'rgba(255,255,255,0.15)' : i < z.hits ? 'rgba(100,200,255,0.9)' : 'rgba(255,255,255,0.7)';
      ctx.fill();
    }
  }

  ctx.restore();
}

function renderParticles() {
  for (const p of GS.particles) {
    if (!p.active) continue;
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    const sz = p.size * alpha;
    ctx.fillRect(p.x - sz/2, p.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function renderScreenDamage() {
  if (GS.screenCracks.length === 0 && GS.screenDistortion === 0) return;
  const W = canvas.width, H = canvas.height;

  // Cracks
  for (const cr of GS.screenCracks) {
    cr.life -= 0.016;
    const alpha = clamp(cr.life / cr.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha * 0.7;
    ctx.strokeStyle = `rgba(255,${Math.floor(200-cr.life*20)},${Math.floor(200-cr.life*20)},1)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const cx = cr.x * W, cy = cr.y * H;
    for (let i=0;i<3;i++) {
      const a = cr.angle + i*(Math.PI*0.5) + rand(-0.3,0.3);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a)*cr.len, cy + Math.sin(a)*cr.len);
    }
    ctx.stroke();
    ctx.restore();
  }
  GS.screenCracks = GS.screenCracks.filter(c=>c.life>0);

  // Red vignette as boss dies
  if (GS.screenDistortion > 0) {
    const vgGrad = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.8);
    vgGrad.addColorStop(0, 'transparent');
    vgGrad.addColorStop(1, `rgba(${Math.floor(200*GS.screenDistortion)},0,0,${GS.screenDistortion*0.6})`);
    ctx.fillStyle = vgGrad;
    ctx.fillRect(0,0,W,H);
  }
}

function renderDimensionalRoom() {
  const W = canvas.width, H = canvas.height;
  const pal = GS.world.palette;

  // Bird's-eye arena background
  const bg = ctx.createRadialGradient(W/2,H/2,50, W/2,H/2,H*0.7);
  bg.addColorStop(0, darken(pal.mid, 0.2));
  bg.addColorStop(0.6, darken(pal.ground, 0.5));
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  // Arena floor tiles
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = pal.accent;
  ctx.lineWidth = 1;
  const tileS = 60;
  for (let x=0;x<W;x+=tileS) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=0;y<H;y+=tileS) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Arena boundary
  ctx.strokeStyle = pal.accent;
  ctx.lineWidth = 3;
  ctx.shadowColor = pal.accent;
  ctx.shadowBlur = 12;
  ctx.strokeRect(20, 50, W-40, H-80);
  ctx.shadowBlur = 0;

  const dr = GS.dimRoom;

  // DEBUG bar — shows live state (temporary)
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, 24);
  ctx.fillStyle = '#ffff00';
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(
    `phase:${dr.phase}  wave:${dr.wave}/${dr.totalWaves}  enemies:${dr.enemies.length}  delay:${(dr.waveDelay||0).toFixed(2)}  exitT:${(dr.exitTimer||0).toFixed(1)}`,
    6, 16
  );
  ctx.restore();

  // Wave counter (hidden during assembly)
  if (dr.phase === 'wave') {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '12px Share Tech Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`WAVE ${dr.wave+1}/${dr.totalWaves}`, 32, 80);
  }

  // Enemies (skip dead — bullets kill during updateBullets which runs after the filter)
  for (const e of dr.enemies) {
    if (e.alive) renderEnemy(e);
  }

  // Red tint + creeper drawn FIRST so door/drops/player render on top
  if ((dr.phase === 'creeperfade' || dr.phase === 'exit') && dr.creeperAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = dr.creeperAlpha * 0.28;
    ctx.fillStyle = '#cc0000';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (!GS._creeperSprite) GS._creeperSprite = buildCreeperSprite();
    // sit in upper-centre of arena, leaving bottom third clear for drops + door
    const ch = Math.floor(H * 0.35);
    const cw = Math.floor(ch * (16 / 24));
    ctx.save();
    ctx.globalAlpha = dr.creeperAlpha * 0.88;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(GS._creeperSprite, W/2 - cw/2, H * 0.12, cw, ch);
    ctx.restore();
  }

  // Physical drops (drawn over creeper)
  if (dr.drops) {
    for (const drop of dr.drops) {
      if (!drop.alive) continue;
      const bob = Math.sin(drop.bobT * 3.5) * 5;
      const col = drop.category === 'gun'
        ? GUN_DEFS[drop.type].color
        : (drop.type === 'heart' ? '#ff4466' : '#ffcc00');
      const lbl = drop.category === 'gun'
        ? GUN_DEFS[drop.type].label
        : (drop.type === 'heart' ? '+HEART' : '+INV');
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 16 + Math.sin(drop.bobT * 4) * 5;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.strokeRect(drop.x, drop.y + bob, drop.w, drop.h);
      ctx.fillStyle = col + '28';
      ctx.fillRect(drop.x, drop.y + bob, drop.w, drop.h);
      ctx.shadowBlur = 0; ctx.fillStyle = col;
      ctx.font = '8px Share Tech Mono, monospace'; ctx.textAlign = 'center';
      ctx.fillText(lbl, drop.x + drop.w/2, drop.y + bob + drop.h/2 + 3);
      ctx.restore();
    }
  }

  // Exit door drawn last — on top of everything
  if (dr.phase === 'exit' || dr.phase === 'creeperfade') {
    for (const door of dr.exitDoors) {
      const active = (door.activeIn || 0) <= 0;
      const pulse = active ? (0.65 + 0.35 * Math.sin(GS.levelTimer * 4)) : 0.3;
      const col = active ? '#ffffff' : '#888888';
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = active ? 22 : 6;
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.globalAlpha = pulse;
      ctx.strokeRect(door.x, door.y, door.w, door.h);
      const dg = ctx.createLinearGradient(door.x, door.y, door.x, door.y+door.h);
      dg.addColorStop(0, active ? 'rgba(255,255,255,0.35)' : 'rgba(128,128,128,0.2)');
      dg.addColorStop(1, 'rgba(0,0,0,0.05)');
      ctx.fillStyle = dg;
      ctx.fillRect(door.x, door.y, door.w, door.h);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = col; ctx.globalAlpha = pulse;
      ctx.font = 'bold 10px Chakra Petch, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = col; ctx.shadowBlur = active ? 8 : 0;
      ctx.fillText(active ? 'EXIT' : '...', door.x + door.w/2, door.y - 8);
      ctx.restore();
    }
  }
}

function renderAnnounce() {
  if (GS.announceAlpha <= 0) return;
  const W = canvas.width, H = canvas.height;
  const alpha = clamp(GS.announceAlpha > 1 ? 1 : GS.announceAlpha, 0, 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = GS.world.palette.accent;
  ctx.font = `bold ${clamp(Math.floor(W*0.04),18,42)}px Chakra Petch, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = GS.world.palette.accent;
  ctx.shadowBlur = 20;
  ctx.fillText(GS.announceText, W/2, H*0.18);
  ctx.shadowBlur = 0;
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  GS.announceAlpha -= 0.016;
}

// ── Color Helpers ─────────────────────────────
function darken(hex, amount) {
  return adjustColor(hex, -amount);
}
function lighten(hex, amount) {
  return adjustColor(hex, amount);
}
function adjustColor(hex, amount) {
  try {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const nr = clamp(Math.round(r*(1+amount)), 0, 255);
    const ng = clamp(Math.round(g*(1+amount)), 0, 255);
    const nb = clamp(Math.round(b*(1+amount)), 0, 255);
    return `rgb(${nr},${ng},${nb})`;
  } catch(e) { return hex; }
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ── Timer display ─────────────────────────────
function formatTime(s) {
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ── Main Game Loop ─────────────────────────────
const TICK = 1000/60;
let lastTime = 0;
let accumulator = 0;
let running = false;

function gameLoop(timestamp) {
  if (!running) return;
  const raw = timestamp - lastTime;
  lastTime = timestamp;
  const dt = Math.min(raw, 100) / 1000;
  accumulator += raw;

  update(dt);
  render();
  clearJust();
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (GS.state === 'gameover' || GS.state === 'title') return;

  updateTouchControls();
  GS.levelTimer += dt;
  GS.flashAlpha = Math.max(0, GS.flashAlpha - dt*3);

  // Screen flash update
  const flashEl = document.getElementById('dim-flash');
  flashEl.style.opacity = GS.flashAlpha;

  if (GS.state === 'dimensional') {
    updatePlayerDim(dt);
    updateDimensionalRoom(dt);
    updateBullets(dt);
    updateParticles(dt);
    return;
  }

  if (GS.state === 'transition') {
    updateParticles(dt);
    return;
  }

  if (GS.state === 'boss_cinematic') {
    updateCinematic(dt);
    updateParticles(dt);
    return;
  }

  // Progress world reveal
  if (GS.worldReveal >= 0 && GS.worldReveal < 1) {
    GS.worldReveal = Math.min(1, GS.worldReveal + dt * 0.22);
  }

  // Playing / boss
  updatePlayer(dt);
  updateCamera(dt);
  updateEnemies(dt);
  if (GS.bossActive) updateBoss(dt);
  updateParticles(dt);
  updateBullets(dt);
  updateWeaponPickups(dt);
  checkDimDoor(dt);
  checkLevelComplete();
  checkBossWarning();

  // Timer display
  document.getElementById('timer-display').textContent = formatTime(GS.levelTimer);

  updateHUD();
}

function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const pal = GS.world.palette;

  if (GS.state === 'boss_cinematic') {
    renderCinematic();
    return;
  }

  if (GS.state === 'dimensional') {
    renderDimensionalRoom();
    renderPlayer();
    renderBullets();
    renderParticles();
    renderAnnounce();
    return;
  }

  // Side-scroller render
  renderBackground(pal);
  renderFloor();
  renderPlatforms();
  renderDimDoor();

  // Monumental world name in world space — player walks through it
  if (GS.worldReveal >= 0) {
    renderMonumentalText();
  }

  // Enemies
  for (const e of GS.enemies) renderEnemy(e);

  // Boss
  if (GS.bossActive) renderBoss();

  // Player
  renderPlayer();
  renderBullets();
  renderParticles();
  renderScreenDamage();
  renderAnnounce();
  renderPickupPrompt();
  renderGunHUD();


  // Progressive reveal overlay (fade in from black after boss cinematic)
  if (GS.worldReveal >= 0 && GS.worldReveal < 1) {
    const revAlpha = Math.max(0, 1 - GS.worldReveal * 1.25);
    ctx.fillStyle = `rgba(0,0,0,${revAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Weapon pickups render on top of overlay so icons are always visible
  if (GS.worldReveal < 0 || GS.worldReveal >= 0.8) {
    renderWeaponPickups();
  }
}

function renderMonumentalText() {
  const W = canvas.width, H = canvas.height;
  const reveal = GS.worldReveal;

  // Ease-in: smoothstep
  const tIn = clamp((reveal - 0.05) / 0.75, 0, 1);
  const easeIn = tIn * tIn * (3 - 2 * tIn);
  if (easeIn <= 0.01) return;

  // Text in world space — player walks through it
  const worldX = 180;
  const sx = worldX - GS.cameraX;
  if (sx > W * 1.5) return;

  const fontSize = Math.floor(H * 0.18);
  ctx.font = `${fontSize}px 'Rubik Distressed', sans-serif`;
  const textW = ctx.measureText(GS.world.name).width;

  // Fade only as the right edge exits the left side of the screen
  const rightEdge = sx + textW;
  if (rightEdge < 0) return;
  const fadeOut = clamp(rightEdge / (W * 0.22), 0, 1);

  ctx.save();
  ctx.globalAlpha = easeIn * fadeOut * 0.38;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = GS.world.palette.accent;
  ctx.fillText(GS.world.name, sx, H * 0.5);
  ctx.restore();
}

// ── Start / Restart ────────────────────────────
function doStart() {
  stopTitleAnim();
  initAudio();
  document.body.classList.remove('at-title');
  document.getElementById('title-screen').classList.add('hidden');
  resetGame();
  GS.state = 'playing';
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
function doRestart() {
  initAudio();
  document.getElementById('gameover-screen').classList.add('hidden');
  resetGame();
  GS.state = 'playing';
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
document.getElementById('start-btn').addEventListener('click', doStart);
document.getElementById('start-btn').addEventListener('touchend', e => { e.preventDefault(); doStart(); }, {passive: false});
document.getElementById('restart-btn').addEventListener('click', doRestart);
document.getElementById('restart-btn').addEventListener('touchend', e => { e.preventDefault(); doRestart(); }, {passive: false});

// ── Boss level transition warning ─────────────
function checkBossWarning() {
  const bw = document.getElementById('boss-warning');
  if (GS.bossActive) {
    bw.style.opacity = 0.5 + 0.5*Math.sin(GS.levelTimer*6);
  } else if (GS.distanceTraveled > GS.distanceGoal * 0.7) {
    bw.style.opacity = 0.5 + 0.5*Math.sin(GS.levelTimer*4);
  } else {
    bw.style.opacity = 0;
  }
}

// Hook checkBossWarning into update
const origUpdate = update;
// Patch update to call boss warning check
const _update = update;
// Actually inline it — redo in the main update above

// Disable context menu on canvas
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchstart',  e => e.preventDefault(), {passive: false});
document.addEventListener('touchmove',   e => e.preventDefault(), {passive: false});

document.addEventListener('gesturechange',e=> e.preventDefault(), {passive: false});

// ── Title Screen Animation ─────────────────────
let titleRAF = null;
let titleState = null;

function startTitleAnim() {
  const pal = { accent: '#cc44ff' };
  titleState = {
    t: 0, lastTs: null,
    char: { x: -50, facing: 1, walkPhase: 0, shootTimer: 0.8 },
    bullets: [],
    malbecAlpha: 0,
    staticAlpha: 0,
    staticTimer: rand(4, 7),
    sprite: buildPlayerSprite(),
    noiseCanvas: null,
  };
  titleRAF = requestAnimationFrame(titleFrame);
}

function stopTitleAnim() {
  if (titleRAF) { cancelAnimationFrame(titleRAF); titleRAF = null; }
  titleState = null;
}

function titleFrame(ts) {
  if (!titleState) return;
  titleRAF = requestAnimationFrame(titleFrame);
  const W = canvas.width, H = canvas.height;
  const dt = Math.min(0.05, titleState.lastTs ? (ts - titleState.lastTs) / 1000 : 0.016);
  titleState.lastTs = ts;
  const s = titleState;
  s.t += dt;

  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W/2, H * 0.42, 0, W/2, H * 0.42, W * 0.65);
  bg.addColorStop(0, 'rgba(90,0,140,0.55)');
  bg.addColorStop(0.55, 'rgba(40,0,70,0.28)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // MALBEC — slow fade in, dual-pass purple+magenta glow
  s.malbecAlpha = Math.min(1, s.malbecAlpha + dt * 0.22);
  const fontSize = Math.min(W * 0.13, 96);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${fontSize}px 'Chakra Petch', sans-serif`;
  const titleY = H * 0.38;
  // Purple glow
  ctx.globalAlpha = s.malbecAlpha;
  ctx.shadowColor = '#cc44ff';
  ctx.shadowBlur = 45 + 22 * Math.sin(s.t * 1.7);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('MALBEC', W / 2, titleY);
  // Magenta overlay
  ctx.shadowColor = '#ff44cc';
  ctx.shadowBlur = 22 + 12 * Math.sin(s.t * 2.4 + 1.2);
  ctx.globalAlpha = s.malbecAlpha * 0.38;
  ctx.fillStyle = '#ff99ff';
  ctx.fillText('MALBEC', W / 2, titleY);
  // Version
  ctx.globalAlpha = s.malbecAlpha * 0.45;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cc88ff';
  ctx.font = "11px 'Share Tech Mono', monospace";
  ctx.fillText('v' + VERSION, W / 2, titleY + Math.floor(fontSize * 0.6) + 14);
  ctx.restore();

  // Floor level for character + bullets
  const floorY = H * 0.80;
  const charW = 28, charH = 48;

  // Character walk
  const c = s.char;
  c.x += 88 * c.facing * dt;
  c.walkPhase += dt * 10;
  if (c.x > W + 60) { c.x = W + 60; c.facing = -1; }
  if (c.x < -60)    { c.x = -60;    c.facing =  1; }
  const bobY = floorY - charH + Math.abs(Math.sin(c.walkPhase)) * 5;

  ctx.save();
  ctx.shadowColor = '#cc44ff';
  ctx.shadowBlur = 12;
  if (c.facing < 0) {
    ctx.translate(c.x + charW, bobY);
    ctx.scale(-1, 1);
    ctx.drawImage(s.sprite, 0, 0, charW, charH);
  } else {
    ctx.drawImage(s.sprite, c.x, bobY, charW, charH);
  }
  ctx.restore();

  // Shoot bouncing bullets
  c.shootTimer -= dt;
  if (c.shootTimer <= 0 && s.bullets.length < 22) {
    c.shootTimer = rand(0.65, 1.3);
    s.bullets.push({
      x: c.x + (c.facing > 0 ? charW + 2 : -4),
      y: bobY + charH * 0.38,
      vx: c.facing * rand(180, 320),
      vy: rand(-220, 60),
      col: Math.random() < 0.55 ? '#cc44ff' : '#ff44cc',
      life: rand(5, 9),
    });
  }

  // Update + draw bullets — pure bounce, no gravity
  for (const b of s.bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.x < 5)      { b.x = 5;        b.vx =  Math.abs(b.vx); }
    if (b.x > W - 5)  { b.x = W - 5;    b.vx = -Math.abs(b.vx); }
    if (b.y < 8)      { b.y = 8;        b.vy =  Math.abs(b.vy); }
    if (b.y > floorY) { b.y = floorY;   b.vy = -Math.abs(b.vy); }
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.life * 0.35);
    ctx.shadowColor = b.col;
    ctx.shadowBlur = 16;
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  s.bullets = s.bullets.filter(b => b.life > 0);

  // Static bursts — purple-tinted low-res noise scaled up
  s.staticTimer -= dt;
  if (s.staticTimer <= 0) {
    s.staticAlpha = 0.92;
    s.staticTimer = rand(4, 8);
  }
  if (s.staticAlpha > 0) {
    if (!s.noiseCanvas) {
      s.noiseCanvas = document.createElement('canvas');
      s.noiseCanvas.width = 160;
      s.noiseCanvas.height = 90;
    }
    const nc = s.noiseCanvas.getContext('2d');
    const img = nc.createImageData(160, 90);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255;
      d[i]   = Math.floor(v * 0.65);
      d[i+1] = Math.floor(v * 0.05);
      d[i+2] = Math.floor(v * 0.95);
      d[i+3] = Math.floor(s.staticAlpha * 255);
    }
    nc.putImageData(img, 0, 0);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(s.noiseCanvas, 0, 0, W, H);
    ctx.restore();
    s.staticAlpha = Math.max(0, s.staticAlpha - dt * 3.5);
  }
}

// On load: fonts ready — preload Orbitron then start title animation
document.fonts.ready.then(() => {
  document.fonts.load("900 48px 'Orbitron'").finally(() => {
    startTitleAnim();
  });
});

<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  var scrollRaf=0;
  function emitScroll(){
    scrollRaf=0;
    var x=window.scrollX||window.pageXOffset||0;
    var y=window.scrollY||window.pageYOffset||0;
    window.parent.postMessage({type:'INLINE_EDIT_SCROLL',scrollX:x,scrollY:y},'*');
  }
  window.addEventListener('scroll',function(){
    if(scrollRaf)return;
    scrollRaf=requestAnimationFrame(emitScroll);
  },{passive:true,capture:true});
  emitScroll();
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
